name: Deploy Mernstack Perfume App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  client:
    name: Deploy Client to Netlify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (Client)
        run: npm install
        working-directory: ./client

      - name: Build Client
        run: npm run build
        working-directory: ./client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to Netlify (Client)
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: ./client/dist
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy Client from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-commit-status: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.CLIENT_SITE_ID }}

  admin:
    name: Deploy Admin to Netlify
    runs-on: ubuntu-latest
    needs: client
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (Admin)
        run: npm install --legacy-peer-deps
        working-directory: ./admin

      - name: Build Admin
        run: npm run build
        working-directory: ./admin
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to Netlify (Admin)
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: ./admin/dist
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy Admin from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-commit-status: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.ADMIN_SITE_ID }}

  backend:
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest
    needs: [client, admin]   # Runs after client & admin
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (Backend)
        run: npm install
        working-directory: ./backend

      - name: Build Backend (if needed)
        run: npm run build
        working-directory: ./backend

      - name: Deploy to Railway
        run: |
          curl -sSL https://railway.app/install.sh | sh
          railway login --apiKey ${{ secrets.RAILWAY_API_KEY }}         
          cd ./backend
          railway up --production
        env:
          RAILWAY_API_KEY: ${{ secrets.RAILWAY_API_KEY }}  
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}  # optional if you have multiple projects
          DB_URL: ${{ secrets.DB_URL }}  # your backend env variables
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
